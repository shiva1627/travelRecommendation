<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelBloom - Contact Us</title>
    <style>
        /* Basic Reset & Styling */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: white;
        }

        /* Navbar Styling (No search bar/buttons) */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0f172a;
            padding: 15px 30px;
            border-bottom: 1px solid #1e293b;
        }

        .navbar-brand a {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: white;
            font-size: 1.5rem;
        }

        .navbar-links a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 1rem;
        }

        .navbar-links a:hover {
            text-decoration: underline;
        }

        /* Contact Us Page Container with Background */
        .contact-container {
            position: relative;
            min-height: calc(100vh - 70px);
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 80px;
        }

        /* Social Media Sidebar */
        .social-icons {
            display: flex;
            flex-direction: column;
            position: absolute;
            left: 30px;
            top: 40px;
            gap: 15px;
        }

        .social-icons a {
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px;
            border-radius: 4px;
            text-align: center;
        }

        /* Left Side Header Text */
        .contact-header {
            margin-left: 60px;
            max-width: 400px;
        }

        .contact-header h1 {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .contact-header p {
            font-size: 1rem;
            color: #cbd5e1;
        }

        /* Right Side Form Box */
        .contact-form-box {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #0d9488;
            padding: 30px;
            border-radius: 8px;
            width: 400px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #e2e8f0;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid #334155;
            border-radius: 4px;
            color: white;
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #0d9488;
        }

        .submit-btn {
            background-color: #0d9488;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .submit-btn:hover {
            background-color: #0f766e;
        }
    </style>
</head>
<body>

    <!-- Task 5 Navbar -->
    <nav>
        <div class="navbar-brand">
            <a href="travel_recommendation.html">
                <span class="logo-icon">✈️</span> 
                <span class="brand-title"><em>TravelBloom</em></span>
            </a>
        </div>

        <div class="navbar-links">
            <a href="travel_recommendation.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
        </div>
    </nav>

    <!-- Contact Us Page Container -->
    <main class="contact-container">
        <!-- Social Media Sidebar -->
        <div class="social-icons">
            <a href="#" aria-label="Twitter">🐦</a>
            <a href="#" aria-label="Facebook">📘</a>
            <a href="#" aria-label="Instagram">📷</a>
            <a href="#" aria-label="YouTube">▶️</a>
        </div>

        <!-- Left Heading Section -->
        <div class="contact-header">
            <h1>CONTACT US</h1>
            <p>Get in touch</p>
        </div>

        <!-- Right Form Section -->
        <div class="contact-form-box">
            <form>
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="4" placeholder="Enter your message" required></textarea>
                </div>

                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </div>
    </main>

</body>
</html>
